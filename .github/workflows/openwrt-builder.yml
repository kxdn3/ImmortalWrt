#
# 产物只保留 x86_64 物理机整盘刷机包（ext4 + squashfs）：
#   *-generic-ext4-combined-efi.img.gz
#   *-generic-ext4-combined.img.gz
#   *-generic-squashfs-combined-efi.img.gz
#   *-generic-squashfs-combined.img.gz
#

name: ImmortalWrt云编译

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    # 每天北京时间凌晨 3:30 自动编译 (UTC 19:30)
    - cron: '30 19 * * *'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 10G
  CCACHE_COMPRESS: 1
  # 路径归一化：避免绝对路径(/workdir/openwrt/...)和 CWD 进入哈希，跨 runner 复用缓存
  CCACHE_NOHASHDIR: 1
  CCACHE_BASEDIR: /workdir

jobs:
  build:
    name: 编译
    runs-on: ubuntu-22.04

    steps:
    - name: 检出源码
      uses: actions/checkout@main

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        mkdir -p "$CCACHE_DIR"

    - name: 克隆源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存 ccache
      uses: actions/cache@v4
      with:
        path: /workdir/.ccache
        key: ccache-${{ runner.os }}-${{ hashFiles('diy-part1.sh', 'diy-part2.sh', '.config') }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ hashFiles('diy-part1.sh', 'diy-part2.sh', '.config') }}-
          ccache-${{ runner.os }}-

    - name: 缓存下载目录 (dl)
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/dl
        # v2：旧缓存里的 go 模块缓存被"清理小文件"误删过源码，前缀必须和旧 key 断开
        key: dl-${{ runner.os }}-v2-${{ hashFiles('diy-part1.sh', 'diy-part2.sh', '.config') }}-${{ github.run_id }}
        restore-keys: |
          dl-${{ runner.os }}-v2-${{ hashFiles('diy-part1.sh', 'diy-part2.sh', '.config') }}-
          dl-${{ runner.os }}-v2-

    - name: 加载自定义 feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        # 删掉与 package/ 里第三方包同名的 feed 包，并重建索引
        $GITHUB_WORKSPACE/$DIY_P1_SH cleanup

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        # 启用 ccache 加速编译
        echo "CONFIG_CCACHE=y" >> .config
        # 让 OpenWrt 把 ccache 缓存写到 workflow 缓存的目录。
        # 否则 rules.mk 默认写 $(TOPDIR)/.ccache（openwrt/.ccache），与 cache action
        # 缓存的 /workdir/.ccache 路径错位，导致缓存永远是空的、跨 run 无法命中。
        echo 'CONFIG_CCACHE_DIR="/workdir/.ccache"' >> .config
        # 再写一次，确保即使 .config / diy 被改过，也不会编出虚拟机镜像
        cat >> .config << 'EOF'

        # === 工作流强制：仅 x86 物理机整盘刷机镜像（ext4 + squashfs）===
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        CONFIG_TARGET_ROOTFS_EXT4FS=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_IMAGES_GZIP=y
        CONFIG_GRUB_IMAGES=y
        CONFIG_GRUB_EFI_IMAGES=y
        # CONFIG_TARGET_ROOTFS_TARGZ is not set
        # CONFIG_ISO_IMAGES is not set
        # CONFIG_QCOW2_IMAGES is not set
        # CONFIG_VDI_IMAGES is not set
        # CONFIG_VMDK_IMAGES is not set
        # CONFIG_VHDX_IMAGES is not set
        # CONFIG_ONIE_INSTALLER_IMAGES is not set
        EOF

    - name: 下载依赖包
      id: package
      run: |
        cd openwrt
        # Go 模块缓存不完整会让 yq / mihomo 等 Go 包编译失败
        # （典型报错：build constraints exclude all Go files in dl/go-mod-cache/.../go-isatty@v0.0.20）
        # 旧缓存有可能缺文件，这里强制重新拉取，保证模块目录完整
        if [ -d dl/go-mod-cache ]; then
          echo "===== 清空 go 模块缓存，重新下载（旧缓存可能不完整）====="
          rm -rf dl/go-mod-cache
        fi
        make defconfig
        # immortalwrt/master 的 CONFIG_CCACHE 定义在 Config-devel.in（依赖 DEVEL），
        # make defconfig 会因依赖不满足把它丢弃，导致 ccache 全程不生效（0 命中、存 218B 空包）。
        # 必须在 defconfig 之后重新写入；后续 make 直接读 .config，不再跑 defconfig，故能真正挂上 ccache。
        echo "CONFIG_CCACHE=y" >> .config
        echo 'CONFIG_CCACHE_DIR="/workdir/.ccache"' >> .config
        echo "===== 镜像相关配置 ====="
        grep -E '^(# )?CONFIG_(GRUB_IMAGES|GRUB_EFI_IMAGES|TARGET_ROOTFS_EXT4FS|TARGET_ROOTFS_SQUASHFS|TARGET_ROOTFS_TARGZ|ISO_IMAGES|QCOW2_IMAGES|VDI_IMAGES|VMDK_IMAGES|VHDX_IMAGES|TARGET_IMAGES_GZIP|ONIE_INSTALLER_IMAGES)' .config || true
        grep -q '^CONFIG_GRUB_EFI_IMAGES=y' .config
        grep -q '^CONFIG_GRUB_IMAGES=y' .config
        grep -q '^CONFIG_TARGET_ROOTFS_EXT4FS=y' .config
        grep -q '^CONFIG_TARGET_ROOTFS_SQUASHFS=y' .config
        if grep -qE '^CONFIG_(ISO_IMAGES|QCOW2_IMAGES|VDI_IMAGES|VMDK_IMAGES|VHDX_IMAGES|TARGET_ROOTFS_TARGZ|ONIE_INSTALLER_IMAGES)=y' .config; then
          echo "仍有非物理机镜像被打开，停止编译"
          exit 1
        fi
        make download -j8
        # 只清理顶层"下载失败"的小体积压缩包（出错页面/空包）。
        # 必须限定 -maxdepth 1：dl/go-mod-cache 里的 .go 源码文件普遍小于 1KB，
        # 递归删除会把模块缓存打成残废（缺 isatty_linux.go 之类），Go 包直接编译失败。
        echo "===== 体积异常（<1KB）的顶层下载文件 ====="
        find dl -maxdepth 1 -type f -size -1024c -exec ls -l {} \;
        find dl -maxdepth 1 -type f -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        ccache -s || true
        make -j$(nproc) || make -j1 || make -j1 V=s
        ccache -s || true
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理固件文件
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        set -euo pipefail
        shopt -s nullglob
        dst="$GITHUB_WORKSPACE/firmware"
        rm -rf "$dst"
        mkdir -p "$dst"
        found=0
        for src in openwrt/bin/targets/*/*; do
          [ -d "$src" ] || continue
          for f in \
            "$src"/*-generic-ext4-combined.img \
            "$src"/*-generic-ext4-combined.img.gz \
            "$src"/*-generic-ext4-combined-efi.img \
            "$src"/*-generic-ext4-combined-efi.img.gz \
            "$src"/*-generic-squashfs-combined.img \
            "$src"/*-generic-squashfs-combined.img.gz \
            "$src"/*-generic-squashfs-combined-efi.img \
            "$src"/*-generic-squashfs-combined-efi.img.gz
          do
            cp -v "$f" "$dst/"
            found=$((found + 1))
          done
        done
        if [ "$found" -lt 1 ]; then
          echo "未找到 x86 物理机刷机包，目标目录内容："
          find openwrt/bin/targets -maxdepth 3 -type f -printf '%p\n' || true
          exit 1
        fi
        (
          cd "$dst"
          sha256sum ./*-generic-*-combined*.img* > sha256sums
        )
        echo "保留的刷机包："
        ls -lah "$dst"
        echo "FIRMWARE=$dst" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成 Release 标签
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        cat > release.txt << 'EOF'
        只包含 x86_64 物理机整盘刷机包（ext4 + squashfs）：

        - `*-generic-ext4-combined-efi.img.gz`：UEFI，ext4
        - `*-generic-ext4-combined.img.gz`：纯 BIOS / CSM，ext4
        - `*-generic-squashfs-combined-efi.img.gz`：UEFI，squashfs（可恢复出厂）
        - `*-generic-squashfs-combined.img.gz`：纯 BIOS / CSM，squashfs

        不含虚拟机镜像、ISO 和 rootfs 归档。
        写盘时关掉 Secure Boot，启动模式选 UEFI（老 BIOS 机用不带 efi 的那一个）。
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到 Release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 清理旧编译记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 10

    - name: 清理旧 Release
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
